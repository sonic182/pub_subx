name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  check:
    name: Format, Credo & Test (Elixir ${{ matrix.elixir_version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - elixir_version: "1.15"
            otp_version: "26"
          - elixir_version: "1.16"
            otp_version: "26"
          - elixir_version: "1.17"
            otp_version: "27"
          - elixir_version: "1.18"
            otp_version: "27"
          - elixir_version: "1.19"
            otp_version: "28"

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir_version }}
          otp-version: ${{ matrix.otp_version }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir_version }}-${{ matrix.otp_version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir_version }}-${{ matrix.otp_version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Run tests
        run: mix test
